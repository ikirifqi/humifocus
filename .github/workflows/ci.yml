name: CI

on:
  push:
  pull_request:
  # The deploy workflow runs these checks before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    # Firebase web config, compiled into the build. See `.env.example`.
    env:
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET }}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check

      # A release built without the Firebase config would deploy an app that cannot sign in.
      - if: github.event_name == 'workflow_dispatch'
        name: Require Firebase config
        run: |
          missing=$(env | grep '^PUBLIC_FIREBASE_.*=$' | cut -d= -f1 || true)
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables before releasing: $(echo $missing)"
            exit 1
          fi

      - run: pnpm build

      # Hand the checked build to the deploy workflow, so it ships exactly what passed.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          if-no-files-found: error
          retention-days: 7
