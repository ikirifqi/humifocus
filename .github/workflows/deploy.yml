name: Deploy

# Release a version: check and build main, deploy it to Cloudflare Pages, then tag the
# commit and publish a GitHub release with the build attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0 or 1.3.0-beta.1 (tagged with a v prefix)
        required: true
        type: string

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Override with the CLOUDFLARE_PROJECT_NAME repository variable.
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'humifocus' }}
  WRANGLER_VERSION: 4.151.3

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases deploy to production, so run this workflow on main."
            exit 1
          fi
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version such as 1.2.0 or 1.3.0-beta.1."
            exit 1
          fi
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Tag $tag already exists. Choose a new version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy and release
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://${{ env.PROJECT_NAME }}.pages.dev
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler="npx --yes wrangler@$WRANGLER_VERSION"
          # Create the Pages project on the first release.
          if ! $wrangler pages project list | grep -qw -- "$PROJECT_NAME"; then
            $wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi
          $wrangler pages deploy build \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Release $TAG"

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -qr "../humifocus-$TAG.zip" .)
          flags=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "humifocus-$TAG.zip" "${flags[@]}"
